# wallpaper
#exec --no-startup-id feh --bg-fill ~/Images/wallpapers/yourname.jpg
#exec --no-startup-id feh --bg-fill ~/Images/wallpapers/oor_2023_up.jpg
exec --no-startup-id feh --bg-fill ~/Images/wallpapers/snk_3.png
# network
exec --no-startup-id nm-applet
# bluetooth
#exec --no-startup-id blueman-applet
# enable numlock
exec --no-startup-id numlockx
# set keyboard to fr
exec --no-startup-id setxkbmap -layout fr
# auto lock after 5 min
exec --no-startup-id xautolock -time 5 -locker '/home/thomas/.config/i3/scripts/lock' &
# music info service
exec --no-startup-id mpDris2
# compositor for transparency
exec --no-startup-id picom
# automount devices
exec --no-startup-id udiskie
# run streamdeck
exec --no-startup-id deckmaster -deck /home/thomas/.config/deckmaster/main.deck

# workspaces utils
exec discord
exec element-desktop
exec thunderbird
exec alacritty --class ncmpcpp -e ncmpcpp
exec alacritty -e cava
exec pavucontrol

exec --no-startup-id i3-msg "workspace $ws4; append_layout ~/.config/i3/workspace-4.json; workspace $ws1"
exec --no-startup-id i3-msg "workspace $ws5; append_layout ~/.config/i3/workspace-5.json; workspace $ws1"
